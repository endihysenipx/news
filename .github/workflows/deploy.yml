name: Deploy News

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, news-intelligence]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and deploy News
        shell: powershell
        run: ./deploy/deploy.ps1
